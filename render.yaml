# Render Blueprint — https://render.com/docs/blueprint-spec
# Create a new Blueprint in the Render dashboard pointing at this repo to
# auto-provision the service. Notes:
#   • Disks require a PAID plan (Starter, ~$7/mo). The free tier can't persist a DB.
#   • Set WP_URL to your service's public URL (https://<service-name>.onrender.com).
#   • Health-check grace: bump to ~300s on first deploy (first boot runs WP install + seed).
services:
  - type: web
    name: linden-court
    runtime: docker
    dockerfilePath: ./render.Dockerfile
    plan: starter
    healthCheckPath: /
    autoDeploy: true
    disk:
      name: lindendata
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: WORDPRESS_DB_NAME
        value: wordpress
      - key: WORDPRESS_DB_USER
        value: wordpress
      - key: WORDPRESS_DB_PASSWORD
        sync: false
      - key: WORDPRESS_DB_HOST
        value: localhost
      - key: WP_TITLE
        value: Linden Court Serviced Apartments
      - key: WP_ADMIN_USER
        value: admin
      - key: WP_ADMIN_PASSWORD
        sync: false
      - key: WP_ADMIN_EMAIL
        value: admin@lindencourt.example
      - key: WP_URL
        value: https://linden-court.onrender.com
