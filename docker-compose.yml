services:
  db:
    image: mariadb:10.11
    container_name: linden-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - wpnet

  wordpress:
    build:
      context: .
      dockerfile: Dockerfile
    image: linden-wp:local
    container_name: linden-wp
    restart: unless-stopped
    depends_on:
      - db
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG', true);
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        @ini_set('display_errors', 0);
        define('FS_METHOD', 'direct');
    ports:
      - "8080:80"
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/themes/linden-court:/var/www/html/wp-content/themes/linden-court
    networks:
      - wpnet

  phpmyadmin:
    image: phpmyadmin:5
    container_name: linden-pma
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      UPLOAD_LIMIT: 256M
    networks:
      - wpnet

volumes:
  db_data:
  wp_data:

networks:
  wpnet:
